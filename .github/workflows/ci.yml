name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install pytest==8.3.5 ruff==0.11.8
      - name: Project checks
        run: python tools/project_checks.py all
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest
