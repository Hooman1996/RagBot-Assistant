name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.4 jsonschema==4.25.1
      - name: Project checks
        run: python tools/project_checks.py all
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest
  android:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/local/toolchain/gradle-home
      TMPDIR: ${{ github.workspace }}/local/scratch/android-ci
    steps:
      - uses: actions/checkout@v4
      - name: Project-local temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.13"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Project-local debug signing key
        run: |
          mkdir -p local/toolchain
          keytool -genkeypair -keystore local/toolchain/replica-debug.keystore \
            -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Pinned SDK build inputs
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, unit tests and lint
        run: ./android/gradlew -p android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
