server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /services.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    location /assistant/v1/ {
        proxy_pass http://127.0.0.1:8101;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
