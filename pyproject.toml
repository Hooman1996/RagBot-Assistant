[project]
name = "ragbot-assistant"
version = "0.0.0"
description = "Banking-app assistant: RagBot answering plus in-app navigation and form preparation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
