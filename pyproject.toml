[project]
name = "ragbot-assistant"
version = "0.0.0"
description = "Banking-app assistant: RagBot answering plus in-app navigation and form preparation"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.25.1", "fastapi==0.124.0", "uvicorn==0.38.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# main_debug.py sets ASSISTANT_DEBUG before its imports, so a paused breakpoint cannot expire a command.
"main_debug.py" = ["E402"]
